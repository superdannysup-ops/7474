name: Build HangulCraft JAR

# Start from the GitHub Actions tab, or build automatically when code changes.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft 1.21.1 Fabric mod
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Validate Korean lessons
        run: python3 tools/validate_lessons.py

      - name: Build Fabric JAR
        run: gradle clean build --no-daemon --stacktrace

      - name: Upload Minecraft mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: HangulCraft-Minecraft-1.21.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 30
